# -----------------------------------------------------------------------------
# 4. Analysis Frameworks — new field (inspired by colleague's "Skills" section).
#    When a trigger_tag is matched, the corresponding framework_id is added to
#    the episode metadata so the deep-analysis stage knows which questions to ask.
# -----------------------------------------------------------------------------
analysis_framework:

  - id: competitor_move
    trigger_tags:
      - streaming_and_platform_competition
      - long_form_video_vs_youtube
      - overseas_short_drama
    name: "Competitor Move Analysis (product / ops / monetization)"
    questions:
      - Why is this competitor making this move? What user need or market gap are they targeting?
      - Which competitive dimensions does this strengthen (quality supply, monetization, mindshare, distribution)?
      - Is the threat real? Can it shift the existing competitive balance? Is our gap widening or narrowing?
      - Is this the optimal market entry approach? What are other players doing differently?
      - From a business/ROI perspective, will this meaningfully change revenue, profit, or content cost ratios?

  - id: ai_tech_progress
    trigger_tags:
      - AI_content_production_L1_to_L4
      - AI_music_and_copyright
    name: "AI Technology Progress Analysis (what new capabilities does this unlock?)"
    questions:
      - Is this a genuine frontier advance, or has something similar been done before?
      - What previously impossible use cases does it unlock? Focus on storytelling, narrative video,
        short drama, AI comics/animation, music, audiobook production.
      - Rate the automation level using L1–L4 (L1 = heavy human labor, L4 = full AI pipeline).
        Does this push scenarios from L1→L2, L2→L3, or L3→L4?
      - Could someone use this to produce high-quality viral content? What does it mean for content quality?
      - Is this a net positive or threat for quality content supply, creator monetization, and copyright safety?

  - id: ai_application_in_content
    trigger_tags:
      - AI_in_operations_and_workflow
      - AI_content_production_L1_to_L4
    name: "AI Application in Content Industry (adoption level & real-world impact)"
    questions:
      - Using L1–L4, what automation tier does this application represent?
      - What are the actual results? For standalone products: DAU/ARR/user count.
        For platform features: penetration rate/watch time/incremental users & revenue.
        For content: play count/follower growth/earnings.
      - Where does human involvement remain (creator / operator / moderator)?
        Which steps has AI already replaced?
      - Who is adopting this — a competitor? PGC or UGC creators?
        Will it change the creator ecosystem or cost structure?

  - id: short_drama_overseas
    trigger_tags:
      - overseas_short_drama
    name: "Overseas Short Drama Analysis (market dynamics & unit economics)"
    questions:
      - Which player and which market? What are the unit economics of
        paid unlock / subscription (ROI, payback period)?
      - What is changing on the content supply side? Is AI (scripting / remake / dubbing)
        reducing costs or increasing output volume?
      - Is this an incremental opportunity or direct competition for our short drama supply,
        IP licensing, and monetization path?
      - Are the claimed user scale, retention, and payment rate figures credible?
        (Be skeptical of PR-inflated numbers.)

  - id: creator_monetization
    trigger_tags:
      - creator_monetization
      - quality_supply_and_creator_growth
    name: "Creator Monetization Analysis (where does the money come from, who gets it?)"
    questions:
      - What are the monetization sources (revenue share / brand deals / e-commerce /
        live / subscription / referral bonus)? What is the scale and revenue per creator?
      - Which creator tier does this favor? Does it reach quality, scarce, and long-form
        creators — the segment we most need to attract?
      - Does this change creator migration incentives? (e.g., does competitor revenue reach
        1/3 of ours — a common threshold for creators to consider switching?)
      - What is the impact on platform content cost ratio, ROI, and ecosystem health?

  - id: vertical_and_ip
    trigger_tags:
      - content_verticals_news_sports_knowledge_entertainment
      - mainstream_audience_expansion
    name: "Key Verticals & IP / Major Events Analysis"
    questions:
      - Which vertical (news / sports / entertainment)? Is this a supply-side shift
        (new talent / rights / publisher) or a consumption-side mindshare shift?
      - Is this tied to a major event or top IP (sports season, election, blockbuster)?
        How much value does it add for user acquisition and audience diversification?
      - Does this widen or narrow our gap vs. competitors in mindshare and quality supply?
      - What are the implications for growing and retaining older, mainstream audiences (35-55)?

# -----------------------------------------------------------------------------
# 5. Exclude Topics — only applied when NO relevant_topic or competitor is also matched.
#    Rule: if an episode matches both an exclude tag and a relevant tag, KEEP IT.
#    Example: "AI chips for video generation cost reduction" = keep (content-industry-relevant).
# -----------------------------------------------------------------------------
exclude_topics:

  - tag: "unrelated_hard_tech"
    note: "Only exclude when there is zero connection to content, creation, distribution, or copyright."
    keywords:
      - semiconductor / chip fabrication / GPU architecture (non-content-compute context)
      - quantum computing
      - robotics / embodied AI (unless related to digital human or content creation)
      - biotech / pharma / medical AI
      - autonomous vehicles / industrial manufacturing / energy / new materials
      - space / rockets / satellites (e.g. SpaceX as a hardware/finance story)

  - tag: "game_making_out_of_scope"
    note: "Game-MAKING is out of our field. This is about producing games, not about video content."
    keywords:
      - video game development / game design / game engines (Unity, Unreal)
      - AI game generation / AI-generated games / procedural game worlds
      - game platforms (e.g. Roblox) as game-creation/UGC-gaming products

  - tag: "traditional_film_business"
    note: >-
      Traditional theatrical / studio film business with NO platform, streaming, creator,
      short-form, or AI angle. EXCLUDE unless it ties to one of those.
    keywords:
      - theatrical box office numbers / opening weekend / box office boom or slump
      - indie film financing / film fund / film P&A / how a film's profits are split
      - film festival deal-making / awards-season campaigns / studio greenlighting
      - traditional movie production economics (no streaming / platform / creator angle)

  - tag: "clearly_irrelevant_topics"
    keywords:
      - celebrity gossip / personal life of celebrities (no industry or monetization angle)
      - pure self-help / career advice / motivational content
      - macroeconomics / stock market / investing (unrelated to content industry)
      - partisan political commentary / elections / politician or CEO behavior — UNLESS it bears on platform, content, or creator policy (then it IS relevant; see platform_policy_and_regulation)
      - edtech / legal / finance vertical AI applications (NOT "knowledge & how-to CONTENT", which is IN scope)

# -----------------------------------------------------------------------------
# 6. Scoring Rules
# -----------------------------------------------------------------------------
scoring:
  relevant_threshold: 5        # relevance_score >= this → is_relevant = true
  high_weight_topic_bonus: 2   # extra points for hitting a weight=high topic
  rules:
    - Any keyword match in relevant_topics makes the episode a candidate.
    - A competitor company mention is ONE signal among many — NOT an automatic pass. Weigh it by context; a competitor named in an unrelated context (drones, pharma, chips, defense, autonomous vehicles) should still score low.
    - If exclude_topics matched but NO relevant_topics or competitor matched → mark not relevant.
    - If both exclude and relevant match → relevant wins (keep the episode).
    - Be skeptical of sweeping AI-disruption claims; lower the score if evidence is thin.
    - A pure-AI episode (no direct content/creator angle) is relevant ONLY if it centers on a genuinely foundational AI capability advance or new development per AI_foundational_capability. Generic AI tech, pure infrastructure (chips, ad systems), historical "how it was built" retrospectives, or AI in unrelated domains (medical, defense, autonomous vehicles) → NOT relevant.
    - Traditional theatrical-film business (box-office numbers, indie-film financing/payout, festival/awards deal-making, studio greenlighting) with NO platform / streaming / creator / short-form / AI angle → score below threshold (NOT relevant). See exclude_topics.traditional_film_business.
    - GUEST OVERRIDE: if a guest is a senior exec at a competitor company (see guest_priority), the episode is relevant regardless of topic — competitor-exec interviews are this tool's primary output.

# -----------------------------------------------------------------------------
# 6b. Guest Priority — THE PRIMARY SIGNAL.
#     This tool is first and foremost a digest of COMPETITOR-EXECUTIVE INTERVIEWS.
#     Identify the guest(s) from the title + show notes (which usually name the guest's
#     company + title), and match the COMPANY against competitor_companies above.
# -----------------------------------------------------------------------------
guest_priority:
  rule: >-
    Identify the episode's guest(s)/speaker(s) and their role + company from the title and
    show notes. Decide whether the guest makes this a PRIORITY interview. Being affiliated
    with a competitor company matters MUCH MORE than seniority.
  priority_if:
    - The guest is a leader (founder / C-level / President / EVP / SVP / VP / Head / GM /
      partner) at any company in competitor_companies above → priority interview.
    - The guest is a founder or senior operator of a notable creator-economy / streaming /
      video / music / short-drama / AI-content company (judge from the company description in
      the show notes), even if not explicitly listed above → priority interview.
  not_priority:
    - Host(s) talking solo / hot takes, or the guest is a journalist / analyst / commentator
      / non-executive with no notable-company affiliation → NOT a priority interview.
  scoring:
    competitor_exec_guest: "+3, AND mark the episode relevant regardless of topic"
    notable_company_operator: "+2"
    host_solo_or_no_name: "-1 (mild downrank; can still qualify on a very strong topic)"
  emphasis: "From a competitor > seniority. Interviews are the primary product of this digest."

# -----------------------------------------------------------------------------
# 7. Output Schema — screening.py must return valid JSON matching this structure
# -----------------------------------------------------------------------------
output_schema:
  format: json
  fields:
    is_relevant: "boolean (true/false)"
    relevance_score: "integer 0-10"
    tags: "array of matched topic tags and competitor names"
    framework_ids: "array of matched analysis_framework ids for deep-read stage"
    reason: "one sentence explaining the relevance judgment"
